
<script>
  // NEXUS VIRTUAL - Integração com Render
  const API_URL = "https://nexus-virtual-backend.onrender.com";

  // Ano automático no rodapé
  document.getElementById("year").textContent =
    new Date().getFullYear();

  // Janela de informações
  function openModal() {
    document.getElementById("infoModal")
      .classList.add("open");
  }

  function closeModal() {
    document.getElementById("infoModal")
      .classList.remove("open");
  }

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") closeModal();
  });

  // Verificar conexão com o backend
  async function verificarBackend() {
    try {
      const resposta = await fetch(
        `${API_URL}/health`,
        { cache: "no-store" }
      );

      if (!resposta.ok) {
        throw new Error(`Erro HTTP: ${resposta.status}`);
      }

      const dados = await resposta.json();

      if (dados.ok === true) {
        console.log("NEXUS VIRTUAL: Servidor conectado!");
        console.log("Dados da API:", dados);
      } else {
        console.warn("Servidor respondeu sem confirmar saúde.");
      }

    } catch (erro) {
      console.error(
        "NEXUS VIRTUAL: Erro na conexão:",
        erro
      );
    }
  }

  // Executar teste ao abrir o site
  verificarBackend();
</script>
